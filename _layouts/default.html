<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% if page.description %}
    <meta name="description" content="{{ page.description }}">
  {% endif %}

  <title>{{ page.title }} · Postmortem</title>

  <link rel="icon" type="image/png" href="{{ '/assets/favicon1.png' | relative_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="{{ '/assets/style.css' | relative_url }}"
  >

  <!-- MathJax -->
  <script>
    MathJax = {
      tex: {
        inlineMath: [
          ['$', '$'],
          ['\\(', '\\)']
        ],
        displayMath: [
          ['$$', '$$'],
          ['\\[', '\\]']
        ]
      }
    };
  </script>

  <script
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
  </script>

</head>

<body>

  <header class="site-header">
    <div class="header-inner">

      <a
        class="site-title"
        href="{{ '/' | relative_url }}"
      >
        Postmortem
      </a>

    </div>
  </header>


  <div class="layout">

    <aside class="sidebar">

      <nav>

        <div class="nav-title">
          Notes
        </div>

        <a href="{{ '/tree' | relative_url }}">
          Decision Trees
        </a>

        <a href="{{ '/model-evaluation' | relative_url }}">
          Model Evaluation
        </a>

        <div class="nav-title" style="margin-top: 24px;">
          About
        </div>

        <a href="{{ '/about' | relative_url }}">
          Contact me
        </a>

      </nav>

    </aside>


    <main class="content">

      {{ content }}

      <script src="https://giscus.app/client.js"
        data-repo="Aksinya-Bykova/postmortem"
        data-repo-id="R_kgDOT_E2WQ"
        data-category="General"
        data-category-id="DIC_kwDOT_E2Wc4DEwNm"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="noborder_gray"
        data-lang="ru"
        data-loading="lazy"
        crossorigin="anonymous"
        async>
      </script>

    </main>

  </div>


  <!-- Code copy -->
  <script>
    document.querySelectorAll(".highlight").forEach(function (block) {

      const button = document.createElement("button");

      button.className = "code-copy";
      button.type = "button";
      button.textContent = "Copy";

      button.addEventListener("click", async function () {

        const code = block.querySelector("code");

        if (!code) return;

        try {

          await navigator.clipboard.writeText(code.innerText);

          button.textContent = "Copied";
          button.classList.add("copied");

          setTimeout(function () {
            button.textContent = "Copy";
            button.classList.remove("copied");
          }, 1500);

        } catch (error) {

          button.textContent = "Failed";

          setTimeout(function () {
            button.textContent = "Copy";
          }, 1500);

        }

      });

      block.appendChild(button);

    });
  </script>

</body>

</html>
